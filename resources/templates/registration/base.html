{# Layout of the login and password pages. Override registration/base.html (or each page) in your templates/ folder. #}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}{{ title }}{% endblock %}</title>
<style>
:root {
    --primary: #6F4E37; --accent: #C8A27A; --bg: #FAF7F2; --surface: #FFFFFF;
    --text: #2B211B; --muted: #6E6259; --border: #E8DFD3; --error: #B3261E;
    --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
    :root { --primary: #C8A27A; --accent: #E2C4A0; --bg: #1C1714; --surface: #26201C; --text: #F1E9DF; --muted: #B5A899; --border: #3A312B; --error: #F2B8B5; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); }
main { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
h1 { margin: 0 0 18px; font-size: 1.4rem; color: var(--primary); }
form > div { margin-bottom: 14px; }
label { display: block; font-weight: 600; margin-bottom: 4px; }
input[type=text], input[type=password], input[type=email] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { width: 100%; padding: 11px; border: 0; border-radius: 8px; background: var(--primary); color: var(--surface); font: inherit; font-weight: 600; cursor: pointer; }
.errorlist { margin: 0 0 6px; padding: 0; list-style: none; color: var(--error); font-size: .92rem; }
.helptext { color: var(--muted); font-size: .85rem; margin-bottom: 4px; }
p { color: var(--muted); }
a { color: var(--primary); }
</style>
</head>
<body>
<main>
<h1>{% block heading %}{{ title }}{% endblock %}</h1>
{% block content %}{% endblock %}
</main>
</body>
</html>
