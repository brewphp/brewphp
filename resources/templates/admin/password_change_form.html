{% extends "admin/base.html" %}

{% block content %}
<p>Please enter your old password, for security’s sake, and then enter your new password twice so we can verify you typed it in correctly.</p>
<form method="post" novalidate class="narrow">
    {% csrf_token %}
    {{ form }}
    <div class="submit-row"><button type="submit" class="button default">Change my password</button></div>
</form>
{% endblock %}
